<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Theme Sync</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="topbar">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M12 2a10 10 0 1 0 8.9 14.6 1 1 0 0 0-1.1-1.4 8 8 0 0 1-9.8-11 1 1 0 0 0-.6-1.7A10 10 0 0 0 12 2z"/>
      </svg>
    </div>
    <div class="titles">
      <p class="title">Theme Sync</p>
      <p class="subtitle">Color-scheme override</p>
    </div>
  </header>

  <main class="content">

    <section class="segmented" role="radiogroup" aria-label="Color scheme mode">
      <button class="segment" data-mode="off" role="radio" aria-checked="false">
        <span class="segment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4.9 3.5 3.5 4.9 8.3 9.7A9 9 0 0 0 21 16a9 9 0 0 0 .4-1.5l-2 .1a7 7 0 0 1-9-6.8L4.9 3.5zM19.1 20.5 4.9 6.3l1.4-1.4L20.5 19.1z" opacity="0"/><path d="M6.3 4.9 4.9 6.3 19.1 20.5l1.4-1.4L15.5 14A9 9 0 0 1 6.3 4.9zM12 3a9 9 0 0 1 8.9 7.7 1 1 0 0 1-1.5 1L12 5A9 9 0 0 1 12 3z"/></svg>
        </span>
        <span class="segment-label">Off</span>
        <span class="segment-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </span>
      </button>

      <button class="segment" data-mode="smart-light" role="radio" aria-checked="false">
        <span class="segment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1.6a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17.4a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.6a1 1 0 0 1 1-1zM3.5 3.5a1 1 0 0 1 1.4 0l1.13 1.13a1 1 0 1 1-1.42 1.42L3.5 4.9a1 1 0 0 1 0-1.4zm14.47 14.47a1 1 0 0 1 1.42 0l1.13 1.13a1 1 0 0 1-1.42 1.42l-1.13-1.13a1 1 0 0 1 0-1.42zM2 12a1 1 0 0 1 1-1h1.6a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17.4 0a1 1 0 0 1 1-1H22a1 1 0 1 1 0 2h-1.6a1 1 0 0 1-1-1zM3.5 20.5a1 1 0 0 1 0-1.42l1.13-1.13a1 1 0 1 1 1.42 1.42L4.9 20.5a1 1 0 0 1-1.4 0zM17.97 5.05a1 1 0 0 1 0-1.42L19.1 2.5a1 1 0 1 1 1.42 1.42L19.4 5.05a1 1 0 0 1-1.43 0z"/></svg>
        </span>
        <span class="segment-label">Smart Light</span>
        <span class="segment-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </span>
      </button>

      <button class="segment" data-mode="smart-dark" role="radio" aria-checked="false">
        <span class="segment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 10.7A9.1 9.1 0 0 1 12 3z"/></svg>
        </span>
        <span class="segment-label">Smart Dark</span>
        <span class="segment-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </span>
      </button>

      <button class="segment" data-mode="native-light" role="radio" aria-checked="false">
        <span class="segment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1.6a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17.4a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.6a1 1 0 0 1 1-1zM2 12a1 1 0 0 1 1-1h1.6a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17.4 0a1 1 0 0 1 1-1H22a1 1 0 1 1 0 2h-1.6a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="segment-label">Native Light</span>
        <span class="segment-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </span>
      </button>

      <button class="segment" data-mode="native-dark" role="radio" aria-checked="false">
        <span class="segment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 10.7A9.1 9.1 0 0 1 12 3z"/></svg>
        </span>
        <span class="segment-label">Native Dark</span>
        <span class="segment-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </span>
      </button>
    </section>

    <section class="status-card" id="statusCard">
      <p class="status-line" id="statusLine">Not overriding anything.</p>
      <p class="status-detail" id="statusDetail">Sites use whatever color scheme they'd normally pick — your OS setting, or their own default.</p>
    </section>

    <p class="footnote" id="footnote"></p>

  </main>

  <script src="popup.js"></script>
</body>
</html>
